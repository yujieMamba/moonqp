name: MoonQP CI
on:
  push:
  pull_request:
jobs:
  target-matrix:
    name: Check and test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Check
        run: moon check --target "${{ matrix.target }}" --deny-warn
      - name: Build
        run: moon build --target "${{ matrix.target }}"
      - name: Test
        if: matrix.target == 'wasm-gc' || matrix.target == 'js' || matrix.target == 'native'
        run: moon test --target "${{ matrix.target }}"
  package:
    name: Format, interface, and examples
    needs: target-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Refresh and verify interfaces
        run: |
          moon info
          git diff --exit-code
      - name: Format check
        run: moon fmt --check
      - name: MPC example
        run: moon run --target wasm-gc examples/mpc
      - name: Constrained estimation example
        run: moon run --target wasm-gc examples/estimation
      - name: Allocation example
        run: moon run --target wasm-gc examples/allocation